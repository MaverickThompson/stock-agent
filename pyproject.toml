[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stockagent"
version = "1.0.0"
description = "HMM market-regime detection with a five-agent review process"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "hmmlearn>=0.3.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=5.0", "matplotlib>=3.8"]

[project.scripts]
stockagent = "stockagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    # hmmlearn warns when EM stops improving at the 1e-6 level. That is
    # convergence, not a problem, and FitReport records it either way.
    "ignore:Model is not converging.*:UserWarning",
]

[tool.coverage.run]
source = ["src/stockagent"]
branch = true

[tool.coverage.report]
# The study modules carry pre-registered behaviour, so an uncovered branch there
# is an untested rule. Research/backtest code is exploratory and excluded.
omit = ["*/__init__.py", "*/cli.py"]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
